name: Build

on:
  push:
    branches: [ main, integrate-upstream-prs ]
    tags: [ 'v*' ]
    # Docs and issue templates never need a build.
    paths-ignore: [ '**.md', '.github/ISSUE_TEMPLATE/**' ]
  pull_request:
    paths-ignore: [ '**.md', '.github/ISSUE_TEMPLATE/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  editor:
    name: Build editor (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: Dev/Typedown.Editor/yarn.lock

      - name: yarn install
        working-directory: Dev/Typedown.Editor
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Test editor
        working-directory: Dev/Typedown.Editor
        env:
          CI: 'true'
        run: yarn test --watchAll=false --runInBand

      - name: yarn build
        working-directory: Dev/Typedown.Editor
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
        run: yarn build

      - uses: actions/upload-artifact@v4
        with:
          name: editor-statics
          path: Dev/Typedown/Resources/Statics/
          if-no-files-found: error
          retention-days: 1

  app:
    name: Build app (${{ matrix.platform }})
    needs: editor
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, ARM64 ]
    env:
      Configuration: Release
      Platform: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: editor-statics
          path: Dev/Typedown/Resources/Statics/

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Dev/Typedown/Typedown.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT
          "arch=$('${{ matrix.platform }}'.ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Stamp test build label
        shell: pwsh
        run: |
          $label = "test.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT+$($env:GITHUB_SHA.Substring(0, 8))"
          $path = "Dev/Typedown.Core/Config.cs"
          $source = Get-Content $path -Raw
          $pattern = 'public const string TestBuild = "[^"]*";'
          if ($source -notmatch $pattern) { throw "TestBuild declaration not found" }
          $source = $source -replace $pattern, "public const string TestBuild = `"$label`";"
          Set-Content $path $source -Encoding utf8
          Write-Host "Test build: $label"

      # Uses the repo's signing certificate (secrets TYPEDOWN_PFX_BASE64 / TYPEDOWN_PFX_PASSWORD) when present,
      # otherwise a throwaway self-signed one. The subject must match Package.appxmanifest's Publisher.
      - name: Prepare signing certificate
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.TYPEDOWN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.TYPEDOWN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "Typedown_Signing.pfx"
          $cer = Join-Path $env:RUNNER_TEMP "Typedown_Signing.cer"
          if ($env:PFX_BASE64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $password = $env:PFX_PASSWORD
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $password)
            [IO.File]::WriteAllBytes($cer, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            Write-Host "Using repository signing certificate: $($cert.Subject)"
          } else {
            $publisher = ([xml](Get-Content Tools/Typedown.Package/Package.appxmanifest)).Package.Identity.Publisher
            $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
              -FriendlyName "Typedown CI" -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            $password = "ci"
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -Force -AsPlainText) | Out-Null
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            Write-Host "No TYPEDOWN_PFX_BASE64 secret; using a throwaway self-signed certificate"
          }
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "cer=$cer" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: >
          msbuild Tools/Typedown.Package/Typedown.Package.wapproj /t:Restore /m
          /p:Configuration=${{ env.Configuration }} /p:Platform=${{ env.Platform }}

      - name: Build MSIX
        id: build
        continue-on-error: true
        run: >
          msbuild Tools/Typedown.Package/Typedown.Package.wapproj /m
          /p:Configuration=${{ env.Configuration }} /p:Platform=${{ env.Platform }}
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=${{ steps.cert.outputs.pfx }}
          /p:PackageCertificatePassword=${{ steps.cert.outputs.password }}
          /p:AppxPackageDir=${{ github.workspace }}\AppxPackages\

      - name: Diagnose MakeAppx failure
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          $map = "Tools/Typedown.Package/obj/${{ env.Platform }}/${{ env.Configuration }}/package.map.txt"
          if (Test-Path $map) {
            Write-Host "===== package.map.txt ====="; Get-Content $map
            $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\makeappx.exe"
            Push-Location Tools/Typedown.Package
            & $makeappx pack /v /l /h sha256 /f "obj/${{ env.Platform }}/${{ env.Configuration }}/package.map.txt" /o /p "$env:RUNNER_TEMP\diag.msix"
            Pop-Location
          } else { Write-Host "no package.map.txt" ; Get-ChildItem -Recurse Tools/Typedown.Package/obj | Select-Object -First 50 }
          exit 1

      # The wapproj already published a self-contained app layout; reuse it for the unpackaged installer and portable zip.
      - name: Locate published app
        id: pub
        shell: pwsh
        run: |
          $dir = Get-ChildItem Dev/Typedown/bin -Recurse -Directory -Filter msixpublish | Select-Object -First 1
          if (-not $dir) { throw "msixpublish folder not found" }
          foreach ($f in "Typedown.exe","Microsoft.UI.Xaml.dll","Microsoft.Graphics.Canvas.dll","msvcp140_app.dll","vcruntime140_app.dll","e_sqlite3.dll","Resources\Statics\index.html") {
            if (-not (Test-Path (Join-Path $dir.FullName $f))) { throw "$f missing in $($dir.FullName)" }
          }
          $arch = "${{ steps.ver.outputs.arch }}"
          if (-not ((Test-Path "$($dir.FullName)\WebView2Loader.dll") -or (Test-Path "$($dir.FullName)\runtimes\win-$arch\native\WebView2Loader.dll"))) { throw "WebView2Loader.dll missing" }
          "dir=$($dir.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Published app: $($dir.FullName)"

      - name: Sign Typedown.exe
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          & $signtool sign /fd SHA256 /f "${{ steps.cert.outputs.pfx }}" /p "${{ steps.cert.outputs.password }}" "${{ steps.pub.outputs.dir }}\Typedown.exe"

      - name: Build installer (Inno Setup) and portable zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $pub = "${{ steps.pub.outputs.dir }}"
          New-Item -ItemType Directory -Force out, out-installer | Out-Null
          $arch = "${{ steps.ver.outputs.arch }}"
          # The portable zip is only produced for releases; day-to-day test artifacts stay small.
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            Compress-Archive -Path "$pub\*" -DestinationPath "out\Typedown-portable-$arch-v$ver.zip" -CompressionLevel Optimal
          }
          # installer
          New-Item -ItemType Directory -Force Tools/Installer/publish | Out-Null
          Copy-Item "$pub\*" Tools/Installer/publish -Recurse -Force
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=$ver /DMyArch=$arch Tools/Installer/Typedown.iss
          $setup = Get-ChildItem Tools/Installer/Output/*.exe | Select-Object -First 1
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          & $signtool sign /fd SHA256 /f "${{ steps.cert.outputs.pfx }}" /p "${{ steps.cert.outputs.password }}" $setup.FullName
          Copy-Item $setup.FullName out
          Copy-Item $setup.FullName out-installer

      - name: Collect MSIX
        shell: pwsh
        run: |
          Get-ChildItem AppxPackages -Recurse -Include *.msix,*.msixbundle | Copy-Item -Destination out
          Copy-Item "${{ steps.cert.outputs.cer }}" out/Typedown-signing-certificate.cer
          Get-ChildItem out

      # Small artifact for everyday testing: just the installer.
      - uses: actions/upload-artifact@v4
        with:
          name: Typedown-installer-${{ steps.ver.outputs.arch }}
          path: out-installer/
          compression-level: 0
          retention-days: 3

      # Full set (installer, MSIX, certificate, portable zip) only on release tags; feeds the release job.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Typedown-${{ steps.ver.outputs.arch }}
          path: out/
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Typedown-x64
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: Typedown-arm64
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # Release notes = the annotated tag's message (what changed) + the file table below.
          ref=$(gh api "repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }}")
          if [ "$(jq -r .object.type <<<"$ref")" = "tag" ]; then
            gh api "repos/${{ github.repository }}/git/tags/$(jq -r .object.sha <<<"$ref")" -q .message | sed '1{/^Typedown /d}' > notes.md
            printf '\n---\n\n' >> notes.md
          else
            : > notes.md
          fi
          cat >> notes.md <<'MD'
          Built by GitHub Actions from tag `${{ github.ref_name }}`.

          | File | What it is |
          |---|---|
          | `Typedown-windows-x64-v*.exe` / `-arm64-` | Installer (Inno Setup) for x64 / ARM64 Windows. Installs WebView2 Runtime if missing, registers `.md` associations. |
          | `Typedown-portable-x64-v*.zip` / `-arm64-` | Portable build – unzip and run `Typedown.exe`. |
          | `Typedown.Package_*_x64.msix` / `_ARM64.msix` | MSIX packages for sideloading. |
          | `Typedown-signing-certificate.cer` | Self-signed certificate used to sign the above. To install the MSIX, first import this into **Local Machine → Trusted People** (or Trusted Root). The .exe/.zip run without it (SmartScreen may warn). |
          MD
          # Re-pushing a tag replaces the existing release in place (notes + assets) instead of failing.
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "Typedown ${{ github.ref_name }}" --notes-file notes.md
            gh release upload "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --repo "${{ github.repository }}" \
              --title "Typedown ${{ github.ref_name }}" \
              --notes-file notes.md
          fi
